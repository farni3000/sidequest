<!doctype html>
<html lang="de" class="h-full scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#070b09" />
    <title>sidequest – KI-Radroutenplaner</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: {
                950: "#070b09",
                900: "#0a0f0d",
                800: "#0f1613",
                700: "#16211c",
              },
              foam: "#e9f4ee",
              sage: "#91a79d",
              lime: {
                50: "#f7ffe0",
                100: "#ecffc0",
                200: "#d9fb7a",
                300: "#c8f560",
                400: "#b5ec3f",
                500: "#9bd823",
                600: "#7fb517",
                700: "#5e8a14",
                800: "#4a6c16",
                900: "#3d5a17",
              },
            },
            fontFamily: {
              sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
              display: ['"Space Grotesk"', "Inter", "sans-serif"],
            },
            transitionTimingFunction: {
              spring: "cubic-bezier(.22,1,.36,1)",
            },
          },
        },
      };
    </script>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/htmx.org@2.0.3"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="/static/style.css?v=2" />
  </head>
  <body class="flex min-h-full flex-col bg-ink-950 font-sans text-foam antialiased">
    <!-- Ambient background: glows, topo contours, grain -->
    <div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden" aria-hidden="true">
      <div
        class="absolute -left-48 -top-52 h-[42rem] w-[42rem] rounded-full bg-lime-300/10 blur-[130px]"
      ></div>
      <div
        class="absolute -right-56 top-1/4 h-[38rem] w-[38rem] rounded-full bg-emerald-400/10 blur-[130px]"
      ></div>
      <div
        class="absolute bottom-[-14rem] left-1/3 h-[30rem] w-[30rem] rounded-full bg-cyan-400/[0.06] blur-[120px]"
      ></div>
      <div class="absolute inset-0 bg-topo"></div>
      <div class="absolute inset-0 bg-grain"></div>
    </div>

    <header
      class="sticky top-0 z-40 border-b border-white/[0.06] bg-ink-950/70 backdrop-blur-xl"
    >
      <div
        class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-4 py-3.5 sm:px-6 lg:px-8"
      >
        <a href="/" class="group flex items-center gap-3">
          <span class="logo-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" class="h-5 w-5">
              <path
                d="M5.5 18.5c0-3.2 3.4-3.6 5.6-5.2 2-1.4 3.9-2.6 3.9-5.3"
                stroke="#08110c"
                stroke-width="2.1"
                stroke-linecap="round"
              />
              <circle cx="5.5" cy="18.5" r="2.2" fill="#08110c" />
              <circle cx="15" cy="8" r="2.2" fill="#08110c" />
            </svg>
          </span>
          <span class="flex flex-col leading-none">
            <span
              class="font-display text-lg font-semibold tracking-tight text-foam transition-colors group-hover:text-lime-200"
              >sidequest</span
            >
            <span class="mt-1 text-[9px] font-medium uppercase tracking-[0.3em] text-sage"
              >KI-Radroutenplaner</span
            >
          </span>
        </a>

        <span class="chip hidden sm:inline-flex">
          <svg viewBox="0 0 24 24" fill="none" class="h-3.5 w-3.5 text-lime-300">
            <path
              d="M12 3v11m0 0 4-4m-4 4-4-4M5 17v2a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-2"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          GPX-Export für Komoot &amp; Co.
        </span>
      </div>
    </header>

    <main class="relative mx-auto w-full max-w-7xl flex-1 px-4 pb-20 pt-10 sm:px-6 lg:px-8">
      {% block content %}{% endblock %}
    </main>

    <footer class="relative border-t border-white/[0.06] py-8">
      <div
        class="mx-auto flex max-w-7xl flex-col items-center justify-between gap-2 px-4 text-[11px] text-sage/70 sm:flex-row sm:px-6 lg:px-8"
      >
        <p>sidequest · gebaut für lange Tage im Sattel</p>
        <p>Karten © Esri · OpenStreetMap contributors</p>
      </div>
    </footer>

    <script src="/static/app.js?v=2"></script>
  </body>
</html>
