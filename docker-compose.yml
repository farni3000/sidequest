services:
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      BROUTER_URL: http://brouter:17777
      DATABASE_URL: sqlite:////data/sidequest.db
    volumes:
      - ./backend/app:/app/app
      - ./data:/data
    depends_on:
      brouter:
        condition: service_started

  brouter:
    build:
      context: ./brouter
      args:
        BROUTER_VERSION: "1.7.10"
    restart: unless-stopped
    ports:
      - "17777:17777"
    environment:
      JAVA_XMX: 2g
    volumes:
      - ./brouter/segments:/segments

volumes: {}
